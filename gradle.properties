# AGP 8.5.2's bundled lint cannot read Kotlin 2.2 metadata: it mis-types stdlib calls and reports
# false RememberReturnType errors. Run the lint from AGP 8.11.1 (the newest AGP that Kotlin 2.2.21
# supports) instead. Lint only; the build itself stays on AGP 8.5.2. Drop this when AGP moves up.
android.experimental.lint.version=8.11.1
